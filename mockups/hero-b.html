<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vladimir Petrosyan — Option B · Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080809;--accent:#4c8dff;--text:#ededed;--muted:#8a8f98;--line:rgba(255,255,255,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

  nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:22px 40px}
  .brand{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.02em;color:var(--muted)}
  .brand b{color:var(--text);font-weight:500}
  .nav-links{display:flex;gap:28px}
  .nav-links a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:color .18s}
  .nav-links a:hover{color:var(--text)}

  /* orb parked on the right, bleeding partly off-screen; feathered so no box */
  #heroOrb{
    position:fixed;top:50%;right:-14vw;transform:translateY(-50%);
    width:min(96vh,86vw);height:min(96vh,86vw);
    cursor:grab;touch-action:none;z-index:1;
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 44%,transparent 64%);
    mask-image:radial-gradient(circle at 50% 50%,#000 44%,transparent 64%);
  }
  #heroOrb:active{cursor:grabbing}

  .stage{position:relative;height:100vh;width:100%;display:flex;align-items:center}
  .copy{position:relative;z-index:2;max-width:640px;padding:0 40px 0 64px}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent);opacity:.9;margin-bottom:22px}
  .name{font-weight:800;font-size:clamp(46px,7.4vw,112px);line-height:.94;letter-spacing:-.04em}
  .name .sur{color:var(--text);position:relative}
  .name .sur::after{content:"";position:absolute;left:2px;bottom:.12em;width:52px;height:5px;background:var(--accent);border-radius:3px}
  .role{margin-top:28px;font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--muted);letter-spacing:.01em;max-width:34ch;line-height:1.55}
  .role .cursor{display:inline-block;width:8px;height:16px;margin-left:2px;background:var(--accent);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .cta{margin-top:36px;display:flex;gap:12px}
  .cta a{font-size:14px;font-weight:600;text-decoration:none;padding:12px 22px;border-radius:9px;transition:all .18s}
  .cta .primary{background:var(--accent);color:#05070d}
  .cta .primary:hover{box-shadow:0 8px 30px rgba(76,141,255,.35);transform:translateY(-1px)}
  .cta .ghost{color:var(--text);border:1px solid var(--line)}
  .cta .ghost:hover{border-color:var(--accent);color:var(--accent)}

  .statusbar{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 40px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:linear-gradient(to top,rgba(8,8,9,.9),transparent)}
  .statusbar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;box-shadow:0 0 8px var(--accent)}
  .hint{opacity:.55}
  .switch{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:12px}
  .switch a{color:var(--muted);text-decoration:none;padding:5px 11px;border:1px solid var(--line);border-radius:20px}
  .switch a.on{color:var(--accent);border-color:var(--accent)}
  @media (max-width:820px){
    .stage{justify-content:center;text-align:center}
    .copy{padding:0 24px}
    #heroOrb{right:auto;left:50%;transform:translate(-50%,-50%);opacity:.5}
    .name .sur::after{left:50%;transform:translateX(-50%)}
    .role{margin-left:auto;margin-right:auto}
    .cta{justify-content:center}
    .nav-links{display:none}.statusbar .hint{display:none}.switch{display:none}
  }
</style>
</head>
<body>
  <div class="switch"><a href="hero-a.html">A · Halo</a><a class="on" href="hero-b.html">B · Split</a><a href="hero-c.html">C · Planetrise</a></div>
  <nav>
    <div class="brand"><b>vlad-p</b>.com</div>
    <div class="nav-links"><a href="#">About</a><a href="#">Skills</a><a href="#">Projects</a><a href="#">Contact</a></div>
  </nav>

  <canvas id="heroOrb"></canvas>
  <div class="stage">
    <div class="copy">
      <div class="eyebrow">Software Developer</div>
      <h1 class="name">Vladimir<br><span class="sur">Petrosyan</span></h1>
      <div class="role">I build things that ship — web platforms, on-device AI, and the tooling in between.<span class="cursor"></span></div>
      <div class="cta"><a class="primary" href="#">View Projects</a><a class="ghost" href="#">Get in touch</a></div>
    </div>
  </div>

  <div class="statusbar">
    <div><span class="dot"></span>main · systems online</div>
    <div class="hint">drag the sphere to spin it — flick for momentum</div>
    <div id="clock">--:--:--</div>
  </div>

  <script src="assets/orb.js" defer></script>
  <script>
    function tick(){var d=new Date();var p=n=>String(n).padStart(2,'0');document.getElementById('clock').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
    setInterval(tick,1000);tick();
    window.addEventListener('DOMContentLoaded',function(){
      (function start(){
        if(!window.AuroraOrb){return setTimeout(start,40);}
        var cv=document.getElementById('heroOrb');
        var orb=new AuroraOrb(cv,{points:window.innerWidth<640?820:1300,fill:0.36});
        orb.setState('idle');setTimeout(function(){orb.setState('think');},600);
        var down=false,lx=0,ly=0;
        cv.addEventListener('pointerdown',function(e){down=true;lx=e.clientX;ly=e.clientY;orb.grab();cv.setPointerCapture(e.pointerId);});
        cv.addEventListener('pointermove',function(e){if(!down)return;orb.dragBy(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;});
        var up=function(){if(down){down=false;orb.release();}};
        cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
      })();
    });
  </script>
</body>
</html>

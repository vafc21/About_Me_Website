<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vlad Petrosyan — Concept A · Command Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#101216;
    --panel-2:#0d0f13;
    --border:#1c2029;
    --border-lit:#2a3346;
    --accent:#4c8dff;
    --accent-dim:rgba(76,141,255,.14);
    --text:#ededed;
    --muted:#8a93a3;
    --muted-2:#5b6472;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }
  /* faint grid backdrop */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
    background-size:44px 44px;
    mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 78%);
  }
  .concept-tag{
    position:fixed;top:16px;left:18px;z-index:20;
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    color:var(--muted-2);
  }
  .concept-tag b{color:var(--accent)}
  header.top{
    position:fixed;top:0;left:0;right:0;z-index:15;
    display:flex;justify-content:flex-end;align-items:center;
    padding:14px 22px;gap:22px;
  }
  header.top nav{display:flex;gap:22px}
  header.top a{
    font-family:var(--mono);font-size:12.5px;color:var(--muted);
    text-decoration:none;letter-spacing:.02em;transition:color .18s;
  }
  header.top a:hover{color:var(--text)}

  main{
    position:relative;z-index:2;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:120px 20px 80px;
    text-align:center;
  }

  /* ── Arc reactor ─────────────────────────────── */
  .reactor{
    position:relative;width:240px;height:240px;margin:0 auto 6px;
  }
  .reactor .core{
    position:absolute;inset:38%;border-radius:50%;
    background:radial-gradient(circle at 50% 42%,#bcd6ff 0%,var(--accent) 46%,#1a4aa0 100%);
    box-shadow:0 0 22px 4px rgba(76,141,255,.55),0 0 60px 10px rgba(76,141,255,.20);
    animation:pulse 3.4s ease-in-out infinite;
  }
  .reactor .ring{
    position:absolute;border-radius:50%;border:1px solid var(--border-lit);
  }
  .reactor .ring.r1{inset:26%;border-color:rgba(76,141,255,.30)}
  .reactor .ring.r2{inset:14%;border-color:rgba(76,141,255,.16)}
  .reactor .ring.r3{inset:2%;border-color:rgba(76,141,255,.08)}
  .reactor .ring.dashed{
    inset:20%;border:1px dashed rgba(76,141,255,.22);
    animation:spin 18s linear infinite;
  }
  /* orbiting iteration chips */
  .orbit{position:absolute;inset:0;animation:spin 22s linear infinite}
  .orbit.o2{animation-duration:32s;animation-direction:reverse}
  .orbit.o3{animation-duration:26s}
  .chip{
    position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:10.5px;color:var(--accent);
    background:var(--panel);border:1px solid var(--border-lit);
    padding:2px 7px;border-radius:20px;white-space:nowrap;
    box-shadow:0 0 12px rgba(76,141,255,.10);
  }
  .orbit.o2 .chip{top:auto;bottom:-13px;color:var(--muted)}
  .orbit.o3 .chip{top:50%;left:-30px;transform:translateY(-50%)}
  .chip.counter{animation:spin-rev 22s linear infinite}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spin-rev{to{transform:rotate(-360deg)}}
  @keyframes pulse{0%,100%{opacity:.92;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

  h1.name{
    font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-.02em;
    margin-top:8px;
  }
  .role{
    font-family:var(--mono);font-size:13.5px;color:var(--muted);
    margin-top:10px;letter-spacing:.02em;
  }
  .role .b{color:var(--accent)}

  /* ── Command palette ─────────────────────────── */
  .palette{
    width:min(620px,92vw);margin-top:42px;text-align:left;
    background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--border);border-radius:14px;
    box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(76,141,255,.04);
    overflow:hidden;
  }
  .palette:focus-within{border-color:var(--border-lit);box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(76,141,255,.22)}
  .search-row{
    display:flex;align-items:center;gap:12px;padding:16px 18px;
    border-bottom:1px solid var(--border);
  }
  .search-row .mag{color:var(--muted-2);font-size:16px;flex-shrink:0}
  #q{
    flex:1;background:transparent;border:none;outline:none;
    color:var(--text);font-family:var(--sans);font-size:16px;
  }
  #q::placeholder{color:var(--muted-2)}
  .kbd{
    font-family:var(--mono);font-size:11px;color:var(--muted);
    border:1px solid var(--border-lit);border-bottom-width:2px;
    border-radius:5px;padding:2px 7px;background:#0b0d11;
  }
  .results{max-height:290px;overflow-y:auto;padding:6px}
  .group-label{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    color:var(--muted-2);text-transform:uppercase;padding:10px 12px 4px;
  }
  .cmd{
    display:flex;align-items:center;gap:13px;padding:10px 12px;
    border-radius:9px;cursor:pointer;transition:background .12s;
  }
  .cmd .ico{
    width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;
    background:#0c0e12;border:1px solid var(--border);border-radius:8px;
    font-family:var(--mono);font-size:13px;color:var(--accent);
  }
  .cmd .txt{flex:1;min-width:0}
  .cmd .t{font-size:14px;font-weight:500}
  .cmd .d{font-size:12px;color:var(--muted);margin-top:1px;font-family:var(--mono)}
  .cmd .go{font-family:var(--mono);font-size:11px;color:var(--muted-2);opacity:0;transition:opacity .12s}
  .cmd.sel,.cmd:hover{background:var(--accent-dim)}
  .cmd.sel .go,.cmd:hover .go{opacity:1;color:var(--accent)}
  .empty{padding:26px;text-align:center;color:var(--muted-2);font-family:var(--mono);font-size:13px}

  footer.status{
    position:relative;z-index:3;
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 16px;border-top:1px solid var(--border);
    font-family:var(--mono);font-size:11px;color:var(--muted-2);
    background:var(--panel-2);
  }
  footer.status .dot{color:var(--accent)}
  @media(max-width:560px){.reactor{width:190px;height:190px}}
</style>
</head>
<body>
  <div class="concept-tag"><b>CONCEPT A</b> · command palette</div>
  <header class="top">
    <nav>
      <a href="#">home</a><a href="#">about</a><a href="#">skills</a><a href="#">projects</a>
    </nav>
  </header>

  <main>
    <div class="reactor" aria-hidden="true">
      <div class="ring r3"></div>
      <div class="ring r2"></div>
      <div class="ring r1"></div>
      <div class="ring dashed"></div>
      <div class="orbit o1"><span class="chip counter">v1 · terminal</span></div>
      <div class="orbit o2"><span class="chip">v2 · hud</span></div>
      <div class="orbit o3"><span class="chip">v3 · dashboard</span></div>
      <div class="core"></div>
    </div>

    <h1 class="name">Vlad Petrosyan</h1>
    <p class="role"><span class="b">student</span> · engineer · robotics developer</p>

    <div class="palette">
      <div class="search-row">
        <span class="mag">⌕</span>
        <input id="q" placeholder="Search or type a command…" autocomplete="off" spellcheck="false" autofocus>
        <span class="kbd">⌘K</span>
      </div>
      <div class="results" id="results"></div>
    </div>
  </main>

  <footer class="status">
    <span><span class="dot">●</span> reactor online · main</span>
    <span id="clock"></span>
  </footer>

<script>
const COMMANDS=[
  {g:"navigate",ico:"~",t:"Home",d:"cd ~/vlad",go:"open"},
  {g:"navigate",ico:"@",t:"About Me",d:"who is Vlad",go:"open"},
  {g:"navigate",ico:"</>",t:"Skills",d:"tech stack & tooling",go:"open"},
  {g:"navigate",ico:"◆",t:"Projects",d:"Rush · Postify · Jarvis · SiteCraft",go:"open"},
  {g:"navigate",ico:"✉",t:"Contact",d:"get in touch",go:"open"},
  {g:"actions",ico:"↗",t:"View GitHub",d:"github.com/vafc21",go:"run"},
  {g:"actions",ico:"⇩",t:"Download Résumé",d:"vlad-petrosyan.pdf",go:"run"},
  {g:"actions",ico:"◐",t:"Toggle Theme",d:"light / dark",go:"run"},
  {g:"actions",ico:"⌘",t:"Copy Email",d:"vladimirpetrosyanjr@gmail.com",go:"run"},
];
const results=document.getElementById('results');
const q=document.getElementById('q');
let sel=0,view=[];

function render(){
  const term=q.value.trim().toLowerCase();
  view=COMMANDS.filter(c=>!term||(c.t+' '+c.d).toLowerCase().includes(term));
  if(sel>=view.length)sel=Math.max(0,view.length-1);
  if(!view.length){results.innerHTML='<div class="empty">no matches — try “projects” or “github”</div>';return}
  let html='',lastG='';
  view.forEach((c,i)=>{
    if(c.g!==lastG){html+=`<div class="group-label">${c.g}</div>`;lastG=c.g}
    html+=`<div class="cmd${i===sel?' sel':''}" data-i="${i}">
      <div class="ico">${c.ico}</div>
      <div class="txt"><div class="t">${c.t}</div><div class="d">${c.d}</div></div>
      <div class="go">${c.go} ↵</div></div>`;
  });
  results.innerHTML=html;
  [...results.querySelectorAll('.cmd')].forEach(el=>{
    el.onmouseenter=()=>{sel=+el.dataset.i;paint()};
    el.onclick=()=>fire(view[+el.dataset.i]);
  });
}
function paint(){[...results.querySelectorAll('.cmd')].forEach((el,i)=>el.classList.toggle('sel',i===sel))}
function fire(c){if(!c)return;q.value='';q.placeholder=`▸ ${c.t} — demo only`;render()}

q.addEventListener('input',()=>{sel=0;render()});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q.focus();q.select()}
  if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,view.length-1);paint()}
  if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);paint()}
  if(e.key==='Enter'){e.preventDefault();fire(view[sel])}
});
function clock(){const n=new Date();document.getElementById('clock').textContent=n.toLocaleTimeString('en-US',{hour12:false})}
clock();setInterval(clock,1000);
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vladimir Petrosyan — hero (Jarvis globe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --accent:#4c8dff;
    --text:#ededed;
    --muted:#8a8f98;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---- top nav: minimal, restrained ---- */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 32px;
  }
  .brand{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;letter-spacing:.02em;color:var(--muted);
  }
  .brand b{color:var(--text);font-weight:500}
  .nav-links{display:flex;gap:28px}
  .nav-links a{
    color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;
    transition:color .18s ease;
  }
  .nav-links a:hover{color:var(--text)}

  /* ---- hero stage ---- */
  .stage{
    position:relative;height:100vh;width:100%;
    display:grid;place-items:center;
  }
  #heroOrb{
    position:absolute;
    width:min(88vh,88vw);height:min(88vh,88vw);
    cursor:grab;touch-action:none;
    z-index:1;
  }
  #heroOrb:active{cursor:grabbing}

  .center{
    position:relative;z-index:2;
    text-align:center;
    pointer-events:none;               /* let the globe stay draggable underneath */
    padding:0 24px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);opacity:.9;margin-bottom:20px;
  }
  .name{
    font-weight:800;
    font-size:clamp(40px,8.2vw,104px);
    line-height:.96;letter-spacing:-.035em;
    text-shadow:0 0 40px rgba(76,141,255,.25);
  }
  .name .sur{color:var(--text)}
  .role{
    margin-top:22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;color:var(--muted);letter-spacing:.02em;
  }
  .role .cursor{
    display:inline-block;width:8px;height:16px;margin-left:2px;
    background:var(--accent);vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .cta{
    margin-top:34px;display:flex;gap:12px;justify-content:center;
    pointer-events:auto;
  }
  .cta a{
    font-size:14px;font-weight:600;text-decoration:none;
    padding:11px 20px;border-radius:9px;transition:all .18s ease;
  }
  .cta .primary{background:var(--accent);color:#05070d}
  .cta .primary:hover{box-shadow:0 8px 30px rgba(76,141,255,.35);transform:translateY(-1px)}
  .cta .ghost{color:var(--text);border:1px solid var(--line)}
  .cta .ghost:hover{border-color:var(--accent);color:var(--accent)}

  /* ---- footer status line, VS Code-ish but muted ---- */
  .statusbar{
    position:fixed;bottom:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 32px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
    border-top:1px solid var(--line);
    background:linear-gradient(to top,rgba(10,10,10,.9),transparent);
  }
  .statusbar .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--accent);margin-right:7px;vertical-align:0;
    box-shadow:0 0 8px var(--accent);
  }
  .hint{opacity:.55}
  @media (max-width:640px){
    .nav-links{display:none}
    .statusbar .hint{display:none}
  }
</style>
</head>
<body>
  <nav>
    <div class="brand"><b>vlad-p</b>.com</div>
    <div class="nav-links">
      <a href="#">About</a>
      <a href="#">Skills</a>
      <a href="#">Projects</a>
      <a href="#">Contact</a>
    </div>
  </nav>

  <div class="stage">
    <canvas id="heroOrb"></canvas>
    <div class="center">
      <div class="eyebrow">Software Developer</div>
      <h1 class="name"><span class="giv">Vladimir</span><br><span class="sur">Petrosyan</span></h1>
      <div class="role">building things that ship<span class="cursor"></span></div>
      <div class="cta">
        <a class="primary" href="#">View Projects</a>
        <a class="ghost" href="#">Get in touch</a>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div><span class="dot"></span>main · systems online</div>
    <div class="hint">drag the sphere to spin it — flick for momentum</div>
    <div id="clock">--:--:--</div>
  </div>

  <script src="assets/orb.js" defer></script>
  <script>
    // live clock in the status bar
    function tick(){
      var d=new Date();
      var p=n=>String(n).padStart(2,'0');
      document.getElementById('clock').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    }
    setInterval(tick,1000);tick();

    // boot the Jarvis AuroraOrb once orb.js has loaded (deferred)
    window.addEventListener('DOMContentLoaded',function(){
      var start=function(){
        if(!window.AuroraOrb){return setTimeout(start,40);}
        var cv=document.getElementById('heroOrb');
        var orb=new AuroraOrb(cv,{points: window.innerWidth<640?820:1300, fill:0.42});
        orb.setState('idle');
        // gentle "thinking" pulse so the hero breathes, like Jarvis on standby
        setTimeout(function(){orb.setState('think');},600);

        // drag-to-spin like a globe (mirrors the Jarvis home orb)
        var down=false,lx=0,ly=0;
        cv.addEventListener('pointerdown',function(e){down=true;lx=e.clientX;ly=e.clientY;orb.grab();cv.setPointerCapture(e.pointerId);});
        cv.addEventListener('pointermove',function(e){if(!down)return;orb.dragBy(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;});
        var up=function(){if(down){down=false;orb.release();}};
        cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
      };
      start();
    });
  </script>
</body>
</html>
